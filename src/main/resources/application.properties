spring.application.name=connectly-api

# =========================================================
# SPRING PROFILE
# =========================================================
# Default profile when running:
# ./gradlew bootRun
spring.profiles.default=dev

# =========================================================
# OPENAPI / SWAGGER
# =========================================================
springdoc.paths-to-match=/v1/**

# =========================================================
# SERVER
# =========================================================
server.port=8080
spring.main.banner-mode=off

# =========================================================
# DATABASE (POSTGRESQL)
# =========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/connectly_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# IMPORTANT:
# Prevent database reset on every bootRun
# =========================================================

# Schema is managed by Flyway (db/migration/V1+)
# spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.flyway.baseline-on-migrate=true

# Disable schema.sql/data.sql auto execution (use Flyway instead)
spring.sql.init.mode=never
spring.datasource.initialize=false

# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# DATADOG METRICS
# =========================================================
management.datadog.metrics.export.enabled=false
management.metrics.export.datadog.enabled=false

# =========================================================
# JWT CONFIGURATION
# =========================================================
jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b

# 1 hour
security.jwt.expiration=3600000

jwt.token-prefix=Bearer
jwt.header=Authorization

# =========================================================
# MAIL CONFIGURATION (LOCAL DEV)
# =========================================================
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.debug=false

# If Mailpit/MailHog is not running,
# do not fail requests
app.mail.fail-on-error=false

# =========================================================
# SECURITY
# =========================================================
security.oauth2.client.csrf.enabled=false

# =========================================================
# CORS
# =========================================================
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS

# =========================================================
# LOGGING
# =========================================================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.com.jomariabejo.connectly_api=DEBUG

# =========================================================
# PASSWORD RESET CONFIGURATION
# =========================================================
security.password.reset.expiry.minutes=15
security.password.reset.max-attempts=5
security.password.reset.attempt-window-minutes=60
security.password.reset.max-otp-attempts=3
security.password.reset.cleanup-interval=3600000
security.password.validation.min-length=8

# =========================================================
# API BASE URL
# =========================================================
app.api.public-base-url=http://localhost:8080/api
app.frontend.public-base-url=http://localhost:3000
app.mail.mailpit-ui-url=http://localhost:8025
security.invitation.expiry-days=7
security.verification.max-otp-attempts=5

# =========================================================
# PAYMONGO
# =========================================================
payments.default-provider=PAYMONGO

payments.paymongo.enabled=true
payments.paymongo.secret-key=${PAYMONGO_SECRET_KEY:}
payments.paymongo.webhook-secret=${PAYMONGO_WEBHOOK_SECRET:}
payments.paymongo.base-url=https://api.paymongo.com

# =========================================================
# PAYPAL
# =========================================================
payments.paypal.enabled=true
payments.paypal.client-id=${PAYPAL_CLIENT_ID:}
payments.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
payments.paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}
payments.paypal.base-url=https://api-m.sandbox.paypal.com