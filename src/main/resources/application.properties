
spring.application.name=connectly-api

# ==========================================================
# Environment overrides
# ==========================================================
# Every ${VAR:default} below reads from, in order: a real environment variable,
# then a .env file in the project root, then the default baked in here.
#
# The defaults are a working local setup, so `./gradlew bootRun` runs with no
# .env at all. Copy .env.example to .env only when you need to change something:
#
#     cp .env.example .env
#
# .env is gitignored. Never commit it.
spring.config.import=optional:file:.env[.properties]

# Spring Boot banner (optional)
spring.main.banner-mode=off

# Server configuration
server.port=${SERVER_PORT:8080}

# Database URL and credentials (example for MySQL) 1??
# spring.datasource.url=jdbc:mysql://localhost:3306/social_network_db
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database URL and credentials (Postgres) 2??
spring.jpa.hibernate.show-sql=${JPA_SHOW_SQL:true}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/connectly_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}


spring.sql.init.mode=never
spring.datasource.initialize=true
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

# JPA (Hibernate) settings
spring.jpa.open-in-view=false

# WARNING: create-drop rebuilds the schema on every start and DROPS IT ON SHUTDOWN.
# Fine for local development, data loss anywhere else. Set JPA_DDL_AUTO=validate or none
# in .env for any environment whose data you want to keep.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create-drop}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true


# JWT Configuration
# The default below is a throwaway development key that is committed to the repo, so it is
# public knowledge. Generate your own for anything non-local and set JWT_SECRET in .env:
#     openssl rand -hex 32
jwt.secret-key=${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
# 1h in millisecond
security.jwt.expiration=${JWT_EXPIRATION_MS:3600000}
jwt.token-prefix=Bearer
jwt.header=Authorization

# OAuth2 Configuration for Google
#spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
#spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
#spring.security.oauth2.client.registration.google.scope=profile,email
#spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# Mail Configuration (SMTP) - Local Development
# Defaults target Mailpit/MailHog on localhost:1025 (web UI on http://localhost:8025).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

# OAuth2 Configuration for Facebook
#spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:}
#spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
#spring.security.oauth2.client.registration.facebook.scope=email
#spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/facebook

# Disable CSRF (if you're using JWT and stateless sessions)
security.oauth2.client.csrf.enabled=false

# CORS configuration - modify based on your needs
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.web.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE}

# Logging Configuration (example)
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:DEBUG}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.com.jomariabejo.connectly_api=${LOG_LEVEL_APP:DEBUG}

# Enable HTTPS in Spring Boot (For Production):

# Generate SSL Certificate
# keytool -genkeypair -v -keystore keystore.jks -keyalg RSA -keysize 2048 -validity 365 -alias selfsigned
# server.port=8443
# server.ssl.key-store=classpath:keystore.jks
# server.ssl.key-store-password=your-password
# server.ssl.key-store-type=JKS
# server.ssl.key-alias=selfsigned

# Password Reset Configuration
security.password.reset.expiry.minutes=${PASSWORD_RESET_EXPIRY_MINUTES:15}
security.password.reset.max-attempts=${PASSWORD_RESET_MAX_ATTEMPTS:5}
security.password.reset.attempt-window-minutes=${PASSWORD_RESET_ATTEMPT_WINDOW_MINUTES:60}
security.password.reset.max-otp-attempts=${PASSWORD_RESET_MAX_OTP_ATTEMPTS:3}
security.password.reset.cleanup-interval=${PASSWORD_RESET_CLEANUP_INTERVAL_MS:3600000}
security.password.validation.min-length=${PASSWORD_MIN_LENGTH:8}
app.password-reset.redirect-url=${PASSWORD_RESET_REDIRECT_URL:http://localhost:8080/reset-password}

# OpenAPI / Swagger UI (springdoc)
# Spec:        http://localhost:8080/v3/api-docs  (add .yaml for the YAML form)
# Swagger UI:  http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.packages-to-scan=com.jomariabejo.connectly_api.controller
# The smoke-test controllers (/test/helloworld, /user/dashboard, /admin/dashboard) live in that
# same package; they are kept out of the spec with @Hidden on the classes themselves.
