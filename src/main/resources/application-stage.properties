# Staging Environment Configuration (using demo stable config)
spring.application.name=connectly-api
spring.main.banner-mode=off

# Server configuration (Docker container)
server.port=8080

# Database URL and credentials (PostgreSQL - Docker container)
spring.jpa.hibernate.show-sql=false
spring.datasource.url=jdbc:postgresql://postgres-stage:5432/connectly_db_stage
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:admin}

# Database initialization
spring.sql.init.mode=never
spring.datasource.initialize=false
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

# JPA (Hibernate) settings - validate only in staging
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration - should be injected as secret
jwt.secret-key=${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
security.jwt.expiration=3600000
jwt.token-prefix=Bearer
jwt.header=Authorization

# Logging - INFO level for staging
logging.level.root=WARN
logging.level.com.jomariabejo.connectly_api=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# Mail Configuration - use SendGrid or similar for staging
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# CORS Configuration - restrict to staging domain
server.servlet.context-path=/api

app.api.public-base-url=http://localhost:8081/api

# Actuator endpoints - enable for monitoring staging features
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.endpoints.web.base-path=/actuator

# Datadog APM Configuration
management.datadog.metrics.export.enabled=false
management.metrics.export.datadog.enabled=false
management.metrics.distribution.percentiles-histogram.http.server.requests=true
