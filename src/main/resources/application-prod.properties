# Production Environment Configuration
spring.application.name=connectly-api
spring.main.banner-mode=off

# Server configuration (Docker container)
server.port=8080

# Database URL and credentials (PostgreSQL - Docker container or managed DB)
spring.jpa.hibernate.show-sql=false
spring.datasource.url=jdbc:postgresql://postgres-prod:5432/connectly_db_prod
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Connection pool optimization for production
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Database initialization
spring.sql.init.mode=never
spring.datasource.initialize=false
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false

# JPA (Hibernate) settings - validate only in production (no auto DDL)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# JWT Configuration - MUST be injected from environment variable
jwt.secret-key=${JWT_SECRET}
security.jwt.expiration=3600000
jwt.token-prefix=Bearer
jwt.header=Authorization

# Logging - WARN level for production, minimal debug info
logging.level.root=WARN
logging.level.com.jomariabejo.connectly_api=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# Mail Configuration - use SendGrid or similar production email service
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# CORS Configuration - restrict to production domain only
server.servlet.context-path=/api

app.api.public-base-url=${APP_API_PUBLIC_BASE_URL:http://localhost:8083/api}

# Actuator endpoints - restricted in production
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.diskspace.enabled=true
management.endpoints.web.base-path=/actuator

# Datadog APM Configuration - ENABLED for production
management.metrics.export.datadog.enabled=true
management.metrics.export.datadog.api-key=${DD_API_KEY}
management.metrics.export.datadog.application-key=${DD_APP_KEY}
management.metrics.export.datadog.step=1m
management.metrics.tags.service=${DD_SERVICE:connectly-api}
management.metrics.tags.env=${DD_ENVIRONMENT:prod}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Enable compression for production
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# Security - enforce HTTPS in production
server.ssl.enabled=false
# If using SSL, configure:
# server.ssl.key-store=${SSL_KEYSTORE_PATH}
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
