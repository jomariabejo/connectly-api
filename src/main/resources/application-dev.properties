# Development Environment Configuration
spring.application.name=connectly-api
spring.main.banner-mode=off

# Server configuration (local development)
server.port=8080

# Database URL and credentials (PostgreSQL - local development)
spring.jpa.hibernate.show-sql=true
spring.datasource.url=jdbc:postgresql://localhost:5432/connectly_db
spring.datasource.username=postgres
spring.datasource.password=admin

# Schema via Flyway (see db/migration/V1__core_schema.sql)
spring.sql.init.mode=never
spring.flyway.enabled=true

# JPA validates against Flyway-managed schema
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
security.jwt.expiration=3600000
jwt.token-prefix=Bearer
jwt.header=Authorization

# Logging - DEBUG for development
logging.level.root=INFO
logging.level.com.jomariabejo.connectly_api=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Mail Configuration - MailHog for local testing
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# CORS Configuration - allow localhost client
server.servlet.context-path=/api
# Management endpoints enabled for development
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoint.health.show-details=always
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Actuator endpoint prefix
management.endpoints.web.base-path=/actuator

# Email links (include /api context path)
app.api.public-base-url=http://localhost:8080/api

# Frontend URLs for verification and password-reset emails
app.frontend.public-base-url=http://localhost:3000
app.mail.fail-on-error=false
app.mail.mailpit-ui-url=http://localhost:8025

# Datadog metrics export disabled for local development
management.datadog.metrics.export.enabled=false
management.metrics.export.datadog.enabled=false

# OAuth2 Configuration (optional, not enabled in dev)
# spring.security.oauth2.client.registration.google.client-id=
# spring.security.oauth2.client.registration.google.client-secret=
