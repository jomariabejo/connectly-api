          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
    PaginationDtoPostResponseDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/PostResponseDto"
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
    PaginationDtoCommentResponseDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/CommentResponseDto"
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
    DeleteAccountRequestDto:
      type: object
      properties:
        reason:
          type: string
