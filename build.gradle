plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.4.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jomariabejo'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-hateoas'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.vladmihalcea:hibernate-types-60:2.21.1'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.0'  // API module
	implementation 'io.jsonwebtoken:jjwt-impl:0.11.0' // Impl module
	implementation 'io.jsonwebtoken:jjwt-jackson:0.11.0' // Jackson module

	implementation("org.mapstruct:mapstruct:1.6.3")
	implementation("org.mapstruct:mapstruct-processor:1.6.3")

	// OpenAPI 3 spec generation + Swagger UI (served at /swagger-ui.html and /v3/api-docs)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.projectlombok:lombok:1.18.36'

	annotationProcessor 'org.projectlombok:lombok:1.18.36'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.2.Final'

	// spring-boot-starter-test already brings JUnit 5, Mockito 5, mockito-junit-jupiter,
	// AssertJ, JSONassert, Hamcrest and MockMvc -- no extra Mockito dependency is needed.
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	testCompileOnly 'org.projectlombok:lombok:1.18.36'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'

	// .env is read by Spring Boot itself via spring.config.import in application.properties,
	// so no dotenv library is needed on the classpath.
	implementation("org.springframework.boot:spring-boot-starter-mail:3.4.4")
}

compileJava {
	options.annotationProcessorPath = configurations.annotationProcessor
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

// Database-free suite: every Mockito unit test and @WebMvcTest controller slice, but not
// ConnectlyApiApplicationTests, whose @SpringBootTest context needs a live Postgres on :5432.
tasks.register('unitTest', Test) {
	description = 'Runs the Mockito unit tests and controller slice tests (no database required).'
	group = 'verification'
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	filter {
		excludeTestsMatching 'com.jomariabejo.connectly_api.ConnectlyApiApplicationTests'
	}
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}
