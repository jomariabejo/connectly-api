# Render Blueprint: https://render.com/docs/infrastructure-as-code
# Apply from the Render Dashboard (Blueprints) after pushing this file to your repo.

databases:
  - name: connectly-db
    databaseName: connectly_db_prod
    user: connectly
    region: oregon
    plan: basic-256mb

services:
  - type: web
    name: connectly-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod,render
      - key: DATABASE_URL
        fromDatabase:
          name: connectly-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MANAGEMENT_METRICS_EXPORT_DATADOG_ENABLED
        value: "false"
      - key: APP_API_PUBLIC_BASE_URL
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: SPRING_WEB_CORS_ALLOWED_ORIGINS
        sync: false
